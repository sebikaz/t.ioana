<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine’s Day 💖</title>

<style>
*{box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{
  margin:0;height:100vh;
  background:radial-gradient(circle at top,#7b1fa2,#0d0221);
  display:flex;align-items:center;justify-content:center;
  color:#fff;
}
.card{
  width:90%;max-width:420px;
  background:rgba(255,255,255,.08);
  border-radius:20px;padding:30px;
  text-align:center;position:relative;
}
button{
  width:100%;padding:14px;margin-top:12px;
  border-radius:12px;font-size:16px;
  transition: all 0.2s ease; /* animare când butonul se mărește */
}
.yes{
  border:none;
  background:linear-gradient(45deg,#ff2d55,#ff5fa2);
  color:#fff;
}
.no{
  position:absolute;
  background:transparent;
  border:1px solid rgba(255,255,255,.3);
  color:#fff;
}
</style>
</head>

<body>
<div class="card" id="card">
  <h1>Ioana,</h1>
  <p>vrei să fii partenera mea de Valentine’s Day? 💌</p>
  <button class="yes" id="yesBtn" onclick="accept()">Da, vreau! 💖</button>
  <button class="no" id="noBtn">Nu</button>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const card = document.getElementById("card");

noBtn.addEventListener("click", () => {
  // Obținem dimensiunea curentă a butonului "Da"
  const style = window.getComputedStyle(yesBtn);
  const currentWidth = parseFloat(style.width);
  const currentHeight = parseFloat(style.height);

  // Mărim butonul "Da" cu 20% la fiecare click
  yesBtn.style.width = currentWidth * 1.2 + "px";
  yesBtn.style.height = currentHeight * 1.2 + "px";
});

function accept(){
  card.innerHTML="<h1>Yeeey! 🥰</h1><p>Te pup si ma iubesti</p>";
}
</script>
</body>
</html>
