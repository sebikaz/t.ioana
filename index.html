<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine’s Day 💖</title>

<style>
*{box-sizing:border-box;font-family:'Segoe UI',sans-serif;margin:0;padding:0;}
body{
  margin:0;height:100vh;
  background:radial-gradient(circle at top,#7b1fa2,#0d0221);
  display:flex;align-items:center;justify-content:center;
  color:#fff;overflow:hidden;
}
.card{
  width:90%;max-width:420px;
  background:rgba(255,255,255,.08);
  border-radius:20px;padding:30px;
  text-align:center;position:relative;
}
button{
  width:100%;padding:14px;margin-top:12px;
  border-radius:12px;font-size:16px;
  transition: all 0.2s ease;
  cursor:pointer;
}
.yes{
  border:none;
  background:linear-gradient(45deg,#ff2d55,#ff5fa2);
  color:#fff;
}
.no{
  position:absolute;
  background:transparent;
  border:1px solid rgba(255,255,255,.3);
  color:#fff;
}
.confetti {
  position: absolute;
  width: 10px;
  height: 10px;
  background-color: #ff2d55;
  opacity: 0.8;
  pointer-events: none;
  animation: fall linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(100vh) rotate(360deg);
    opacity: 0;
  }
}
</style>
</head>

<body>
<div class="card" id="card">
  <h1>Ioana,</h1>
  <p>vrei să fii partenera mea de Valentine’s Day? 💌</p>
  <button class="yes" id="yesBtn" onclick="accept()">Da, vreau! 💖</button>
  <button class="no" id="noBtn">Nu</button>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const card = document.getElementById("card");

// Butonul "Nu" face butonul "Da" mai mare și se mai mișcă puțin haotic
noBtn.addEventListener("click", () => {
  // mărire buton "Da"
  const style = window.getComputedStyle(yesBtn);
  const currentWidth = parseFloat(style.width);
  const currentHeight = parseFloat(style.height);
  yesBtn.style.width = currentWidth * 1.2 + "px";
  yesBtn.style.height = currentHeight * 1.2 + "px";

  // mișcare mică a butonului "Nu"
  const maxX = card.clientWidth - noBtn.offsetWidth;
  const maxY = card.clientHeight - noBtn.offsetHeight;
  noBtn.style.left = Math.random() * maxX + "px";
  noBtn.style.top = Math.random() * maxY + "px";
});

// funcție confetti
function createConfetti(){
  const colors = ["#ff2d55","#ff5fa2","#ffca3a","#8ac926","#1982c4"];
  for(let i=0;i<100;i++){
    const confetti = document.createElement("div");
    confetti.classList.add("confetti");
    confetti.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
    confetti.style.left = Math.random() * window.innerWidth + "px";
    confetti.style.top = "-20px";
    confetti.style.width = 5 + Math.random()*10 + "px";
    confetti.style.height = confetti.style.width;
    confetti.style.animationDuration = 2 + Math.random()*3 + "s";
    confetti.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(confetti);

    // ștergere confetti după animație
    setTimeout(() => confetti.remove(), 5000);
  }
}

function accept(){
  card.innerHTML="<h1>Yeeey! 🥰</h1><p>Te pup și mă iubești 💖</p>";
  createConfetti();
}
</script>
</body>
</html>
