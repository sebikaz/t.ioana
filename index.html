<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine’s Day 💖</title>

<style>
*{
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
  margin:0;
  padding:0;
}
body{
  height:100vh;
  background:radial-gradient(circle at top,#7b1fa2,#0d0221);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  overflow:hidden;
}
.card{
  width:90%;
  max-width:420px;
  background:rgba(255,255,255,.08);
  border-radius:20px;
  padding:30px;
  text-align:center;
  position:relative;
}
button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:12px;
  font-size:16px;
  cursor:pointer;
}
.yes{
  border:none;
  background:linear-gradient(45deg,#ff2d55,#ff5fa2);
  color:#fff;
}
.no{
  position:absolute;
  background:transparent;
  border:1px solid rgba(255,255,255,.3);
  color:#fff;
}
.confetti{
  position:absolute;
  width:10px;
  height:10px;
  opacity:.8;
  pointer-events:none;
  animation:fall linear forwards;
}
@keyframes fall{
  to{
    transform:translateY(100vh) rotate(360deg);
    opacity:0;
  }
}
@keyframes popIn{
  from{
    transform:scale(.8);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}
.credit{
  position:fixed;
  bottom:10px;
  right:10px;
  font-size:12px;
  color:rgba(255,255,255,.6);
  font-style:italic;
}
</style>
</head>

<body>

<div class="card" id="card">
  <h1>Ioana,</h1>
  <p>vrei să fii partenera mea de Valentine’s Day? 💌</p>
  <button class="yes" id="yesBtn" onclick="accept()">Da, vreau! 💖</button>
  <button class="no" id="noBtn">Nu</button>
</div>

<div class="credit">made by sebi c</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const card = document.getElementById("card");

function isOverlapping(a,b){
  return !(a.right<b.left || a.left>b.right || a.bottom<b.top || a.top>b.bottom);
}

noBtn.addEventListener("click",()=>{
  const s = getComputedStyle(yesBtn);
  yesBtn.style.width = parseFloat(s.width)*1.2+"px";
  yesBtn.style.height = parseFloat(s.height)*1.2+"px";

  let placed=false,tries=0;
  while(!placed && tries<50){
    const x=Math.random()*(card.clientWidth-noBtn.offsetWidth);
    const y=Math.random()*(card.clientHeight-noBtn.offsetHeight);
    noBtn.style.left=x+"px";
    noBtn.style.top=y+"px";

    if(!isOverlapping(
      noBtn.getBoundingClientRect(),
      yesBtn.getBoundingClientRect()
    )) placed=true;

    tries++;
  }
});

function createConfetti(){
  const colors=["#ff2d55","#ff5fa2","#ffca3a","#8ac926","#1982c4"];
  for(let i=0;i<120;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.left=Math.random()*innerWidth+"px";
    c.style.top="-20px";
    c.style.width=5+Math.random()*10+"px";
    c.style.height=c.style.width;
    c.style.animationDuration=2+Math.random()*3+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),5000);
  }
}

function accept(){
  card.innerHTML = `
    <h1>Yeeey! 🥰</h1>
    <p>Te pup sefa mea ❤️</p>
    <img src="Screenshot_4.jpg"
         style="
           width:100%;
           margin-top:20px;
           border-radius:18px;
           box-shadow:0 10px 30px rgba(0,0,0,.4);
           animation:popIn .6s ease-out;
         ">
  `;
  createConfetti();
}
</script>

</body>
</html>
