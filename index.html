<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine 💖</title>

<style>
*{
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
  margin:0;
  padding:0;
}
body{
  height:100vh;
  background:radial-gradient(circle at top,#7b1fa2,#0d0221);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  overflow:hidden;
}
.card{
  width:90%;
  max-width:420px;
  background:rgba(255,255,255,.08);
  border-radius:20px;
  padding:30px;
  text-align:center;
  position:relative;
}
h1{margin-bottom:10px;}
p{margin-bottom:20px;}
button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:12px;
  font-size:16px;
  cursor:pointer;
}
.yes{
  border:none;
  background:linear-gradient(45deg,#ff2d55,#ff5fa2);
  color:#fff;
}
.no{
  background:transparent;
  border:1px solid rgba(255,255,255,.3);
  color:#fff;
}
.confetti{
  position:absolute;
  width:10px;
  height:10px;
  opacity:.8;
  pointer-events:none;
  animation:fall linear forwards;
}
@keyframes fall{
  to{
    transform:translateY(100vh) rotate(360deg);
    opacity:0;
  }
}
@keyframes popIn{
  from{transform:scale(.8);opacity:0;}
  to{transform:scale(1);opacity:1;}
}
.credit{
  position:fixed;
  bottom:10px;
  right:10px;
  font-size:12px;
  color:rgba(255,255,255,.6);
}
</style>
</head>

<body>

<div class="card" id="card"></div>
<div class="credit">made by sebi c</div>

<script>
const card = document.getElementById("card");

let step = 0;

const questions = [
  {
    title: "Ioana 💭",
    text: "Pot să te întreb ceva?",
    yes: "Da",
    no: "Nu"
  },
  {
    title: "Hmm 🤔",
    text: "Îți place să petreci timp cu mine?",
    yes: "Da, mult",
    no: "Nu prea"
  },
  {
    title: "Sincer acum 😌",
    text: "M-ai alege pe mine?",
    yes: "Normal",
    no: "Nu știu..."
  },
  {
    title: "Ultima întrebare 💘",
    text: "Vrei să fii cu mine de Valentine’s Day?",
    yes: "DA 💖",
    no: "Nu"
  }
];

function renderQuestion(){
  const q = questions[step];
  card.innerHTML = `
    <h1>${q.title}</h1>
    <p>${q.text}</p>
    <button class="yes" onclick="nextStep()">${q.yes}</button>
    <button class="no">${q.no}</button>
  `;
}

function nextStep(){
  step++;
  if(step < questions.length){
    renderQuestion();
  } else {
    finalScreen();
  }
}

function finalScreen(){
  card.innerHTML = `
    <h1>Yeeey! 🥰</h1>
    <p>Atunci e oficial…</p>
    <p><strong>Valentine’s Day e al nostru 💖</strong></p>
    <img src="poza.png"
         style="
           width:100%;
           margin-top:20px;
           border-radius:18px;
           box-shadow:0 10px 30px rgba(0,0,0,.4);
           animation:popIn .6s ease-out;
         ">
    <p style="margin-top:15px;">Te pup sefa mea ❤️</p>
  `;
  createConfetti();
}

function createConfetti(){
  const colors=["#ff2d55","#ff5fa2","#ffca3a","#8ac926","#1982c4"];
  for(let i=0;i<150;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.left=Math.random()*innerWidth+"px";
    c.style.top="-20px";
    c.style.width=5+Math.random()*10+"px";
    c.style.height=c.style.width;
    c.style.animationDuration=2+Math.random()*3+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),5000);
  }
}

renderQuestion();
</script>

</body>
</html>
